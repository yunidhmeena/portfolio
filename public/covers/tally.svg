  </g>

  <g transform="translate(620 190)">
    <rect x="0" y="0" width="490" height="470" rx="30" fill="#ffffff" stroke="#e1e6db" stroke-width="2"/>
    <text x="34" y="56" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0e0f0c">AI quick-add</text>
    <text x="34" y="80" font-family="Inter, sans-serif" font-size="14" fill="#868685">One sentence becomes a filled form</text>

    <rect x="34" y="112" width="422" height="84" rx="20" fill="#0e0f0c"/>
    <text x="58" y="150" font-family="Inter, sans-serif" font-size="17" fill="#ffffff">"dinner 2400 with Ravi</text>
    <text x="58" y="176" font-family="Inter, sans-serif" font-size="17" fill="#ffffff">and Aman, equal split"</text>

    <g transform="translate(34 226)">
      <rect x="0" y="0" width="422" height="112" rx="20" fill="#f6f8f2" stroke="#cdd9c2" stroke-width="2"/>
      <text x="24" y="36" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#868685">parsed · validated with zod</text>
      <text x="24" y="68" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#0e0f0c">Dinner — ₹2,400.00</text>
      <rect x="24" y="80" width="120" height="24" rx="12" fill="#9fe870"/>
      <text x="40" y="97" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0e0f0c">equal split · 3</text>
    </g>

    <rect x="34" y="366" width="200" height="52" rx="26" fill="#9fe870"/>
    <text x="72" y="399" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0e0f0c">Prefill form</text>
    <text x="256" y="399" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#868685">10 / 5 min cap</text>
  </g>

  <text x="90" y="845" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" fill="#454745">next.js · trpc · prisma · postgresql · nextauth</text>
  <text x="620" y="845" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" fill="#868685">redesign of an MIT-licensed open-source base</text>
