<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#14161a"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" fill="#e8e8e8" font-size="26">
    <text x="90" y="140">$ ./system_monitor.py</text>
    <text x="90" y="210" fill="#9aa0a8">sampling every 1s · ctrl+c to stop</text>
  </g>
  <g transform="translate(90 270)">
    <text x="0" y="0" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" fill="#e8e8e8">CPU</text>
    <rect x="90" y="-18" width="620" height="26" rx="13" fill="#23262c"/>
    <rect x="90" y="-18" width="420" height="26" rx="13" fill="#5fb573"/>
    <text x="0" y="70" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" fill="#e8e8e8">MEM</text>
    <rect x="90" y="52" width="620" height="26" rx="13" fill="#23262c"/>
    <rect x="90" y="52" width="290" height="26" rx="13" fill="#5f8fb5"/>
    <text x="0" y="140" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" fill="#e8e8e8">DSK</text>
    <rect x="90" y="122" width="620" height="26" rx="13" fill="#23262c"/>
    <rect x="90" y="122" width="180" height="26" rx="13" fill="#b5a25f"/>
  </g>
  <g transform="translate(90 500)">
    <polyline points="0,90 90,70 180,84 270,40 360,58 450,22 540,44 620,10"
      fill="none" stroke="#5fb573" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#5fb573">
      <circle cx="90" cy="70" r="6"/><circle cx="270" cy="40" r="6"/>
      <circle cx="450" cy="22" r="6"/><circle cx="620" cy="10" r="6"/>
    </g>
  </g>
  <text x="90" y="800" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" fill="#6f757d">psutil · matplotlib · linux</text>
</svg>
