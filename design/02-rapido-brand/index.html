<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapido Brand Redesign — Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Mobile Frame -->
  <div class="phone-frame">
    <!-- Header -->
    <header class="header">
      <span class="logo">rapido</span>
      <div class="header-actions">
        <button class="icon-btn">📍</button>
        <button class="icon-btn">🔔</button>
      </div>
    </header>

    <!-- Search Bar -->
    <section class="search-section">
      <div class="search-bar">
        <span class="search-icon">📍</span>
        <input type="text" placeholder="Where to?">
      </div>
    </section>

    <!-- Service Cards -->
    <section class="services">
      <div class="service-card selected">
        <div class="service-icon">🛵</div>
        <div class="service-info">
          <h3>Bike</h3>
          <p class="service-price">₹45</p>
          <p class="service-time">⚡ 3 min away</p>
        </div>
        <div class="service-badge">Comfort</div>
      </div>
      <div class="service-card">
        <div class="service-icon">🚗</div>
        <div class="service-info">
          <h3>Auto</h3>
          <p class="service-price">₹120</p>
          <p class="service-time">⚡ 5 min away</p>
        </div>
        <div class="service-badge">Premium</div>
      </div>
    </section>

    <!-- Saved Places -->
    <section class="places-section">
      <h4 class="section-title">Saved Places</h4>
      <div class="place-item">
        <span class="place-icon">🏠</span>
        <div class="place-info">
          <span class="place-name">Home</span>
          <span class="place-address">Koramangala, Bengaluru</span>
        </div>
        <span class="place-chevron">›</span>
      </div>
      <div class="place-item">
        <span class="place-icon">🏢</span>
        <div class="place-info">
          <span class="place-name">Office</span>
          <span class="place-address">Whitefield, Bengaluru</span>
        </div>
        <span class="place-chevron">›</span>
      </div>
    </section>

    <!-- Safety Card -->
    <section class="safety-section">
      <div class="safety-card">
        <div class="safety-header">
          <span class="safety-icon">🛡️</span>
          <h4>Safety Features</h4>
        </div>
        <p>Share live location, SOS button, OTP verification</p>
      </div>
    </section>

    <!-- Book Button -->
    <section class="cta-section">
      <button class="btn-primary">Book Bike ₹45</button>
    </section>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-item active">🏠<span>Home</span></button>
      <button class="nav-item">🛵<span>Rides</span></button>
      <button class="nav-item">📋<span>Activity</span></button>
      <button class="nav-item">👤<span>Profile</span></button>
    </nav>
  </div>

  <script>
    // Service card selection
    document.querySelectorAll('.service-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.service-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        const price = card.querySelector('.service-price').textContent;
        const type = card.querySelector('h3').textContent;
        document.querySelector('.btn-primary').textContent = `Book ${type} ${price}`;
      });
    });

    // Nav item selection
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
