<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#eeeeee"/>

  <g transform="translate(90 130)">
    <rect x="0" y="0" width="450" height="640" rx="30" fill="#ffffff" stroke="#e3e3e3" stroke-width="2"/>
    <path d="M0 30a30 30 0 0 1 30-30h390a30 30 0 0 1 30 30v120H0z" fill="#111113"/>
    <text x="34" y="58" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#9e9ea0" letter-spacing="1.6">FORGE · AI PROGRAM</text>
    <text x="34" y="104" font-family="Inter, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Strength Foundations</text>
    <text x="34" y="134" font-family="Inter, sans-serif" font-size="15" fill="#b9b9bc">3 days / week · intermediate · 45 min</text>

    <g font-family="Inter, sans-serif">
      <text x="34" y="196" font-size="13" font-weight="700" fill="#9e9ea0" letter-spacing="1.2">DAY 1 · PUSH</text>
      <rect x="34" y="212" width="382" height="52" rx="16" fill="#f5f5f5"/>
      <text x="54" y="244" font-size="17" font-weight="500" fill="#111111">Barbell Bench Press</text>
      <text x="360" y="244" font-size="14" fill="#707072">4 x 8</text>
      <rect x="34" y="274" width="382" height="52" rx="16" fill="#f5f5f5"/>
      <text x="54" y="306" font-size="17" font-weight="500" fill="#111111">Incline Dumbbell Press</text>
      <text x="360" y="306" font-size="14" fill="#707072">3 x 10</text>
      <rect x="34" y="336" width="382" height="52" rx="16" fill="#f5f5f5"/>
      <text x="54" y="368" font-size="17" font-weight="500" fill="#111111">Cable Fly</text>
      <text x="360" y="368" font-size="14" fill="#707072">3 x 12</text>

      <text x="34" y="440" font-size="13" font-weight="700" fill="#9e9ea0" letter-spacing="1.2">DAY 2 · PULL</text>
      <rect x="34" y="456" width="382" height="52" rx="16" fill="#f5f5f5"/>
      <text x="54" y="488" font-size="17" font-weight="500" fill="#111111">Deadlift</text>
      <text x="360" y="488" font-size="14" fill="#707072">4 x 5</text>
      <rect x="34" y="518" width="382" height="52" rx="16" fill="#f5f5f5"/>
      <text x="54" y="550" font-size="17" font-weight="500" fill="#111111">Lat Pulldown</text>
      <text x="360" y="550" font-size="14" fill="#707072">3 x 10</text>
    </g>

    <g transform="translate(34 600)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#9e9ea0" letter-spacing="1.2">STREAK</text>
      <g transform="translate(0 14)" fill="#111111">
        <circle cx="9" cy="9" r="9"/><circle cx="39" cy="9" r="9"/><circle cx="69" cy="9" r="9"/>
        <circle cx="99" cy="9" r="9"/><circle cx="129" cy="9" r="9"/>
      </g>
      <g transform="translate(159 14)" fill="none" stroke="#cacacb" stroke-width="2">
        <circle cx="9" cy="9" r="9"/><circle cx="39" cy="9" r="9"/>
      </g>
    </g>
  </g>

  <g transform="translate(610 200)">
    <rect x="0" y="0" width="510" height="440" rx="30" fill="#ffffff" stroke="#e3e3e3" stroke-width="2"/>
    <circle cx="52" cy="56" r="20" fill="#d6d1ff"/>
    <path d="M46 50h12M46 58h12M46 66h7" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
    <text x="86" y="52" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#111111">AI program builder</text>
    <text x="86" y="74" font-family="Inter, sans-serif" font-size="14" fill="#707072">Describe a goal, get an editable plan</text>

    <rect x="30" y="108" width="450" height="70" rx="18" fill="#f5f5f5"/>
    <text x="52" y="140" font-family="Inter, sans-serif" font-size="17" fill="#39393b">"stronger bench, 3 days, home gym"</text>
    <text x="52" y="164" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" fill="#9e9ea0">zod-validated · catalog-matched</text>

    <g transform="translate(30 206)">
      <rect x="0" y="0" width="450" height="88" rx="18" fill="#111111"/>
      <text x="24" y="38" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Draft ready — 2 days, 6 exercises</text>
      <text x="24" y="64" font-family="Inter, sans-serif" font-size="14" fill="#b9b9bc">Edit, then save as a program</text>
      <rect x="330" y="26" width="96" height="38" rx="19" fill="#1eaa52"/>
      <text x="355" y="51" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Save</text>
    </g>

    <g transform="translate(30 322)" font-family="Inter, sans-serif" font-size="14" fill="#707072">
      <rect x="0" y="0" width="130" height="40" rx="20" fill="#f5f5f5"/>
      <text x="22" y="26" fill="#111111">Chest</text>
      <rect x="142" y="0" width="130" height="40" rx="20" fill="#f5f5f5"/>
      <text x="164" y="26" fill="#111111">Back</text>
      <rect x="284" y="0" width="166" height="40" rx="20" fill="#f5f5f5"/>
      <text x="306" y="26" fill="#111111">Home gym</text>
    </g>
  </g>

  <text x="90" y="845" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" fill="#707072">next.js · prisma · postgresql · better auth</text>
  <text x="610" y="845" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" fill="#9e9ea0">redesign of an MIT-licensed open-source base</text>
