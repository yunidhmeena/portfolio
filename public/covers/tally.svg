<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#ecefe7"/>

  <g transform="translate(90 120)">
    <rect x="0" y="0" width="470" height="660" rx="30" fill="#ffffff" stroke="#e1e6db" stroke-width="2"/>
    <rect x="0" y="0" width="470" height="120" rx="30" fill="#0e0f0c"/>
    <rect x="0" y="90" width="470" height="30" fill="#0e0f0c"/>
    <text x="34" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#868685" letter-spacing="1.6">TALLY · GOA TRIP</text>
    <text x="34" y="92" font-family="Inter, sans-serif" font-size="26" font-weight="600" fill="#ffffff">4 members · 12 expenses</text>

    <g font-family="Inter, sans-serif">
      <text x="34" y="176" font-size="13" font-weight="700" fill="#868685" letter-spacing="1.2">GROUP BALANCES</text>

      <circle cx="52" cy="216" r="20" fill="#9fe870"/>
      <text x="52" y="222" font-size="15" font-weight="600" fill="#0e0f0c" text-anchor="middle">R</text>
      <text x="86" y="212" font-size="17" font-weight="500" fill="#0e0f0c">Ravi</text>
      <text x="86" y="234" font-size="13" fill="#868685">paid ₹3,200</text>
      <text x="416" y="222" font-size="17" font-weight="600" fill="#2ead4b" text-anchor="end">+₹640</text>

      <circle cx="52" cy="290" r="20" fill="#ffc091"/>
      <text x="52" y="296" font-size="15" font-weight="600" fill="#0e0f0c" text-anchor="middle">A</text>
      <text x="86" y="286" font-size="17" font-weight="500" fill="#0e0f0c">Aman</text>
      <text x="86" y="308" font-size="13" fill="#868685">paid ₹1,100</text>
      <text x="416" y="296" font-size="17" font-weight="600" fill="#d03238" text-anchor="end">−₹420</text>

      <circle cx="52" cy="364" r="20" fill="#38c8ff"/>
      <text x="52" y="370" font-size="15" font-weight="600" fill="#0e0f0c" text-anchor="middle">Y</text>
      <text x="86" y="360" font-size="17" font-weight="500" fill="#0e0f0c">You</text>
      <text x="86" y="382" font-size="13" fill="#868685">paid ₹2,050</text>
      <text x="416" y="370" font-size="17" font-weight="600" fill="#2ead4b" text-anchor="end">+₹210</text>
    </g>

    <line x1="34" y1="420" x2="436" y2="420" stroke="#e8ebe6" stroke-width="2"/>
    <text x="34" y="462" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#868685" letter-spacing="1.2">RECENT</text>

    <g font-family="Inter, sans-serif">
      <rect x="34" y="478" width="402" height="56" rx="16" fill="#f6f8f2"/>
      <text x="54" y="512" font-size="16" font-weight="500" fill="#0e0f0c">Dinner · Ravi paid</text>
      <text x="416" y="512" font-size="16" font-weight="600" fill="#0e0f0c" text-anchor="end">₹2,400</text>

      <rect x="34" y="544" width="402" height="56" rx="16" fill="#f6f8f2"/>
      <text x="54" y="578" font-size="16" font-weight="500" fill="#0e0f0c">Cab to airport · You paid</text>
      <text x="416" y="578" font-size="16" font-weight="600" fill="#0e0f0c" text-anchor="end">₹780</text>

      <rect x="34" y="610" width="402" height="56" rx="16" fill="#f6f8f2"/>
      <text x="54" y="644" font-size="16" font-weight="500" fill="#0e0f0c">Groceries · Aman paid</text>
      <text x="416" y="644" font-size="16" font-weight="600" fill="#0e0f0c" text-anchor="end">₹1,100</text>
